<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Management Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Employee Management Dashboard</h1>
    <button id="themeToggle">Toggle Theme</button>
  </header>

  <section class="controls">
    <input type="text" id="searchInput" placeholder="Search by name" />
    <select id="departmentFilter">
      <option value="All">All Departments</option>
      <option value="HR">HR</option>
      <option value="Engineering">Engineering</option>
      <option value="Sales">Sales</option>
    </select>
    <button id="uppercaseBtn">Uppercase Names</button>
    <button id="avgSalaryBtn">Calculate Average Salary</button>
  </section>

  <section class="table-section">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Department</th><th>Role</th><th>Salary</th>
        </tr>
      </thead>
      <tbody id="employeeTable"></tbody>
    </table>
    <p id="empCount"></p>
  </section>

  <section class="results">
    <p><strong>Average Salary:</strong> <span id="avgSalaryResult">-</span></p>
    <p><strong>Searched Employee:</strong> <span id="searchResult">-</span></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
